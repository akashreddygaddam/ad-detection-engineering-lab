title: Potential Kerberoasting RC4 Service Ticket Request
id: 7b4ecae8-3e36-4b4f-b88c-44f6b66b65c1
status: experimental
description: >
    Detects Kerberos service ticket requests using RC4 encryption.
    This may indicate Kerberoasting activity and requires investigation.
references:
    - https://attack.mitre.org/techniques/T1558/003/
author: Akash Reddy
date: 2026/11/12

tags:
    - attack.t1558.003

logsource:
    product: windows
    service: security

detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'

    condition: selection

falsepositives:
    - Legacy applications using RC4
    - Older service account configurations
    - Legitimate Kerberos authentication

level: medium
