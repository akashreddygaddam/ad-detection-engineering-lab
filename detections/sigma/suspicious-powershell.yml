title: Suspicious PowerShell Encoded Command
id: 1e80b8b7-3d40-48d5-87aa-70b3e2b29b67
status: experimental
description: Detects encoded PowerShell command execution.
author: Akash Reddy
date: 2026/11/12

references:
    - https://attack.mitre.org/techniques/T1059/001/

tags:
    - attack.execution
    - attack.t1059.001

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_command:
        CommandLine|contains:
            - ' -enc '
            - ' -encodedcommand '

    condition: selection_image and selection_command

falsepositives:
    - Legitimate administrative scripts
    - Software deployment tools

level: medium
