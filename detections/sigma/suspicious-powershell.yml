title: Suspicious Encoded PowerShell Execution
id: 1e80b8b7-3d40-48d5-87aa-70b3e2b29b67
status: experimental
description: >
    Detects PowerShell execution containing encoded command arguments.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Akash Reddy
date: 2026/11/12

tags:
    - attack.execution
    - attack.t1059.001

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_command:
        CommandLine|contains:
            - '-enc '
            - '-encodedcommand '

    condition: selection_image and selection_command

falsepositives:
    - Authorized administrative scripts
    - Software deployment automation
    - Legitimate PowerShell automation

level: medium
